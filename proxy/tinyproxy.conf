# Proxy for AudioBook Bay requests only. Point Prowlarr (tagged proxy) or ABB_PROXY at it.
# Use it when your VPN exit is blocked by ABB: ABB traffic then leaves via your normal connection.
# Only Docker networks may connect, and only ABB domains (+ Prowlarr's proxy test host) are allowed.
Port 8888
Listen 0.0.0.0
Timeout 60
LogLevel Info
MaxClients 20
Allow 127.0.0.1
Allow 172.16.0.0/12
ConnectPort 443
ConnectPort 80
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterDefaultDeny Yes
DisableViaHeader Yes
